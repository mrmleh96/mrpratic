name: MrPratic Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Gradle kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: JAR derle
        run: gradle clean build
      - name: JAR dosyasini sakla
        uses: actions/upload-artifact@v4
        with:
          name: MrPratic
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
