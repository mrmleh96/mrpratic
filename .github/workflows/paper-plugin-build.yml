name: MrPratic Paper build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'
      - name: Build plugin
        run: gradle --no-daemon clean build
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MrPratic-Paper-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
